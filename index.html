<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            src.indexOf('moz-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <link rel="icon" type="image/jpeg" href="/goveda-logo.jpg" />
    <title>GOVEDA Carbon & Climate India Foundation — हरित राजस्थान से हरित भारत</title>
    <meta
      name="description"
      content="Official digital mission platform of GOVEDA Carbon & Climate India Foundation. Green Rajasthan to Green India: tree plantation, carbon awareness, self-reliant gaushalas, rural skills, and heritage conservation."
    />
    <meta property="og:title" content="GOVEDA Carbon & Climate India Foundation" />
    <meta
      property="og:description"
      content="हरित राजस्थान से हरित भारत — Green Rajasthan to Green India. Building climate resilience, agroforestry, and rural prosperity across Rajasthan and India."

    />
